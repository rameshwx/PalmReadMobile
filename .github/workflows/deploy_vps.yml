name: Deploy VPS (Backend)

on:
  push:
    branches: ["main"]
    paths:
      - "laravel_api/**"
      - "cv_service/**"
      - "docker-compose.yml"
      - "scripts/deploy/**"
      - ".env.example"
  workflow_dispatch: {}

concurrency:
  group: deploy-vps-backend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      - name: Add Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync Code To VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          rsync -az --delete \
            --exclude-from="scripts/deploy/rsync_exclude.txt" \
            -e "ssh -o StrictHostKeyChecking=yes" \
            ./ "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/"

      - name: Deploy Remote (Compose Restart, Migrate, Cache Clear)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          ssh -o StrictHostKeyChecking=yes "${VPS_USER}@${VPS_HOST}" \
            "cd ${VPS_PATH} && bash scripts/deploy/deploy_remote.sh"

